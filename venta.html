<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de venta — Acabados Yucatán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .main { padding: 0; display: flex; height: calc(100vh - 65px); overflow: hidden; }

  /* -------- Columna de búsqueda -------- */
  .col-buscar {
    flex: 1.4; display: flex; flex-direction: column; min-width: 0;
    border-right: 1px solid var(--linea);
  }
  .buscar-caja { padding: 18px 22px 14px; border-bottom: 1px solid var(--linea); background: var(--cal); }
  .buscar-caja input {
    width: 100%; font-size: 16px; padding: 13px 14px; border: 1px solid var(--linea);
    border-radius: var(--radio); font-family: inherit;
  }
  .buscar-caja input:focus { border-color: var(--acero); }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 5px 11px; border-radius: 20px; border: 1px solid var(--linea);
    background: #fff; color: var(--texto-suave); font-weight: 500;
  }
  .chip.activo { background: var(--acero); color: #fff; border-color: var(--acero); }

  .lista-resultados { flex: 1; overflow-y: auto; padding: 6px 0; }
  .fila-producto {
    display: grid; grid-template-columns: 90px 1fr 90px 90px 40px;
    gap: 12px; align-items: center;
    padding: 12px 22px; border-bottom: 1px solid var(--linea);
  }
  .fila-producto:hover { background: rgba(43,110,119,0.06); cursor: pointer; }
  .fila-producto .prod-nombre { font-size: 14px; line-height: 1.3; }
  .fila-producto .prod-cat { font-size: 11px; color: var(--texto-suave); margin-top: 2px; }
  .fila-producto .prod-existencia { font-size: 12px; text-align: right; font-family: var(--fuente-mono); }
  .fila-producto .prod-existencia.baja { color: var(--rojo-ladrillo); font-weight: 600; }
  .fila-producto .prod-precio { text-align: right; font-family: var(--fuente-mono); font-weight: 600; }
  .fila-producto .prod-agregar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--acero); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600;
    border: none;
  }

  /* -------- Columna del ticket -------- */
  .col-ticket {
    flex: 1; max-width: 420px; display: flex; flex-direction: column;
    background: var(--cal);
  }
  .ticket-cabecera { padding: 18px 20px 14px; border-bottom: 1px solid var(--linea); }
  .ticket-cabecera .folio { font-size: 11px; color: var(--texto-suave); font-family: var(--fuente-mono); }

  .ticket-lineas { flex: 1; overflow-y: auto; padding: 6px 0; }
  .linea-ticket {
    display: grid; grid-template-columns: 1fr auto; gap: 4px;
    padding: 10px 20px; border-bottom: 1px solid var(--linea);
  }
  .linea-ticket .li-nombre { font-size: 13.5px; grid-column: 1 / -1; }
  .linea-ticket .li-controles { display: flex; align-items: center; gap: 8px; }
  .linea-ticket .li-cant {
    width: 46px; text-align: center; padding: 5px 4px; border: 1px solid var(--linea);
    border-radius: var(--radio); font-family: var(--fuente-mono); font-size: 13px;
  }
  .linea-ticket .li-precio-total { text-align: right; }
  .linea-ticket .li-precio { font-size: 11px; color: var(--texto-suave); }
  .linea-ticket .li-total { font-family: var(--fuente-mono); font-weight: 600; font-size: 14.5px; }
  .linea-ticket .li-quitar { background: none; border: none; color: var(--texto-suave); font-size: 12px; }
  .linea-ticket .li-quitar:hover { color: var(--rojo-ladrillo); }

  .ticket-vacio { text-align: center; color: var(--texto-suave); font-size: 13.5px; padding: 40px 20px; }

  .ticket-detalles { padding: 14px 20px; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 12px; }
  .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toggle-especial {
    font-size: 12.5px; color: var(--acero-osc); background: none; border: none; text-align: left;
    padding: 0; font-weight: 600;
  }
  .bloque-especial { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }

  .ticket-totales { padding: 16px 20px; border-top: 1px solid var(--linea); }
  .fila-total { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 6px; color: var(--texto-suave); }
  .fila-total.grande { font-size: 20px; font-weight: 700; color: var(--concreto-osc); margin-top: 10px; }
  .fila-total .num { font-family: var(--fuente-mono); }
  .input-descuento {
    width: 90px; text-align: right; padding: 4px 8px; border: 1px solid var(--linea);
    border-radius: var(--radio); font-family: var(--fuente-mono); font-size: 13px;
  }

  @media (max-width: 860px) {
    .main { flex-direction: column; height: auto; overflow: visible; }
    .col-buscar { border-right: none; border-bottom: 1px solid var(--linea); }
    .col-ticket { max-width: none; }
    .lista-resultados { max-height: 46vh; }
  }
</style>
</head>
<body>

<div id="app-shell"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const u = APP.montarLayout('venta.html', 'Punto de venta');
const esAdmin = u.rol === 'admin';
document.getElementById('main').innerHTML = `
  <div class="col-buscar">
    <div class="buscar-caja">
      <input type="text" id="buscar" placeholder="Buscar por código o nombre del producto..." autocomplete="off">
      <div class="chips" id="chips-categoria"></div>
    </div>
    <div class="lista-resultados" id="lista-resultados">
      <div class="cargando">Escribe para buscar un producto...</div>
    </div>
  </div>

  <div class="col-ticket">
    <div class="ticket-cabecera">
      <h3>Venta actual</h3>
      <div class="folio" id="folio-nota">nota nueva</div>
    </div>

    <div class="ticket-lineas" id="ticket-lineas">
      <div class="ticket-vacio">Agrega productos de la lista para armar la venta.</div>
    </div>

    <div class="ticket-detalles">
      <div class="campo">
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" placeholder="Público general" list="lista-clientes">
        <datalist id="lista-clientes"></datalist>
      </div>

      <div class="fila-2">
        <div class="campo">
          <label for="tipo_cobro">Forma de cobro</label>
          <select id="tipo_cobro"></select>
        </div>
        <div class="campo">
          <label for="num_factura">Factura (opcional)</label>
          <input type="text" id="num_factura" placeholder="—">
        </div>
      </div>

      <div class="campo-check" id="check-consigna-wrap">
        <input type="checkbox" id="consigna">
        <label for="consigna">Venta en consigna (se maneja como crédito)</label>
      </div>

      <button type="button" class="toggle-especial" id="btn-especial">+ Entrega especial (directo a obra / no llegó a tienda)</button>
      <div class="bloque-especial oculto" id="bloque-especial">
        <div class="campo">
          <label for="entrega">Tipo de entrega</label>
          <select id="entrega"></select>
        </div>
      </div>

      <div class="campo">
        <label for="observacion">Observación (opcional)</label>
        <input type="text" id="observacion" placeholder="—">
      </div>
    </div>

    <div class="ticket-totales">
      <div class="fila-total">
        <span>Subtotal</span>
        <span class="num" id="tot-subtotal">$0.00</span>
      </div>
      <div class="fila-total">
        <span>Descuento</span>
        <input type="number" id="descuento" class="input-descuento" value="0" min="0" step="0.5">
      </div>
      <div class="fila-total grande">
        <span>Total</span>
        <span class="num" id="tot-total">$0.00</span>
      </div>
      <button type="button" class="btn btn-primario btn-grande mt-16" id="btn-cobrar">Cobrar venta</button>
    </div>
  </div>
`;

/* ---------------- Estado de la venta en curso ---------------- */

let ticket = [];       // [{CODIGO, PRODUCTO, PRECIO, CANTIDAD, EXISTENCIA}]
let categoriaActiva = '';
let clientesCache = [];

/* ---------------- Carga inicial ---------------- */

(async function iniciar() {
  try {
    const [cats, catalogos, clientes] = await Promise.all([
      API.listarCategorias(),
      API.catalogos(),
      API.listarClientes()
    ]);
    pintarChipsCategoria(cats);
    llenarSelect('tipo_cobro', catalogos.TIPO_COBRO, 'EFECTIVO');
    llenarSelect('entrega', catalogos.ENTREGA, 'TIENDA');
    clientesCache = clientes;
    document.getElementById('lista-clientes').innerHTML =
      clientes.map(c => `<option value="${APP.escapar(c.NOMBRE)}">`).join('');
  } catch (e) { APP.errorApi(e, 'iniciar venta'); }
  buscarProductos('');
})();

function llenarSelect(id, opciones, porDefecto) {
  const sel = document.getElementById(id);
  sel.innerHTML = opciones.map(o =>
    `<option value="${o}" ${o === porDefecto ? 'selected' : ''}>${etiquetaLegible(o)}</option>`
  ).join('');
}

function etiquetaLegible(clave) {
  const mapa = {
    EFECTIVO: 'Efectivo', TARJETA_CREDITO: 'Tarjeta de crédito', TARJETA_DEBITO: 'Tarjeta de débito',
    TRANSFERENCIA: 'Transferencia', CREDITO: 'Crédito', CHEQUE: 'Cheque',
    TIENDA: 'Entrega en tienda (normal)', DIRECTO_OBRA: 'Directo a obra',
    NO_LLEGO_TIENDA: 'No llegó a tienda'
  };
  return mapa[clave] || clave;
}

document.getElementById('btn-especial').addEventListener('click', () => {
  document.getElementById('bloque-especial').classList.toggle('oculto');
});

/* La consigna se maneja como crédito: al marcarla, se refleja de una vez en el cobro. */
document.getElementById('consigna').addEventListener('change', (e) => {
  const selCobro = document.getElementById('tipo_cobro');
  if (e.target.checked) {
    selCobro.value = 'CREDITO';
    selCobro.disabled = true;
  } else {
    selCobro.disabled = false;
  }
});

/* ---------------- Búsqueda de productos ---------------- */

function pintarChipsCategoria(categorias) {
  const cont = document.getElementById('chips-categoria');
  const chips = [{ CLAVE: '', NOMBRE: 'Todas' }, ...categorias];
  cont.innerHTML = chips.map(c =>
    `<button class="chip ${c.CLAVE === categoriaActiva ? 'activo' : ''}" data-clave="${c.CLAVE}">${APP.escapar(c.NOMBRE)}</button>`
  ).join('');
  cont.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      categoriaActiva = btn.dataset.clave;
      cont.querySelectorAll('.chip').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      buscarProductos(document.getElementById('buscar').value.trim());
    });
  });
}

let temporizadorBusqueda = null;
document.getElementById('buscar').addEventListener('input', (e) => {
  clearTimeout(temporizadorBusqueda);
  temporizadorBusqueda = setTimeout(() => buscarProductos(e.target.value.trim()), 220);
});

async function buscarProductos(texto) {
  const cont = document.getElementById('lista-resultados');
  cont.innerHTML = '<div class="cargando">Buscando...</div>';
  try {
    const productos = await API.listarProductos({ buscar: texto, categoria: categoriaActiva });
    if (!productos.length) {
      cont.innerHTML = '<div class="vacio">No se encontró ningún producto con esa búsqueda.</div>';
      return;
    }
    cont.innerHTML = productos.map(p => `
      <div class="fila-producto" data-codigo="${APP.escapar(p.CODIGO)}">
        <div class="codigo texto-chico">${APP.escapar(p.CODIGO)}</div>
        <div>
          <div class="prod-nombre">${APP.escapar(p.PRODUCTO)}</div>
          <div class="prod-cat">${APP.escapar(p.CATEGORIA)} · ${APP.escapar(p.PROVEEDOR || 'sin proveedor')}</div>
        </div>
        <div class="prod-existencia ${p.EXISTENCIA <= 0 ? 'baja' : ''}">${p.EXISTENCIA} ${p.UNIDAD || ''}</div>
        <div class="prod-precio">${APP.money(p.VENTA)}</div>
        <button class="prod-agregar" type="button" aria-label="Agregar">+</button>
      </div>
    `).join('');

    cont.querySelectorAll('.fila-producto').forEach(fila => {
      const codigo = fila.dataset.codigo;
      const prod = productos.find(p => p.CODIGO === codigo);
      fila.addEventListener('click', () => agregarAlTicket(prod));
    });
  } catch (e) {
    APP.errorApi(e, 'buscar productos');
    cont.innerHTML = '<div class="vacio">No se pudo cargar el catálogo.</div>';
  }
}

/* ---------------- El ticket ---------------- */

function agregarAlTicket(prod) {
  const existente = ticket.find(l => l.CODIGO === prod.CODIGO);
  if (existente) {
    existente.CANTIDAD += 1;
  } else {
    ticket.push({
      CODIGO: prod.CODIGO, PRODUCTO: prod.PRODUCTO,
      PRECIO: prod.VENTA, CANTIDAD: 1, EXISTENCIA: prod.EXISTENCIA
    });
  }
  pintarTicket();
}

function pintarTicket() {
  const cont = document.getElementById('ticket-lineas');

  if (!ticket.length) {
    cont.innerHTML = '<div class="ticket-vacio">Agrega productos de la lista para armar la venta.</div>';
  } else {
    cont.innerHTML = ticket.map((l, i) => `
      <div class="linea-ticket" data-i="${i}">
        <div class="li-nombre">${APP.escapar(l.PRODUCTO)}</div>
        <div class="li-controles">
          <input type="number" class="li-cant" value="${l.CANTIDAD}" min="1" step="1">
          <button type="button" class="li-quitar">Quitar</button>
        </div>
        <div class="li-precio-total">
          <div class="li-precio">${APP.money(l.PRECIO)} c/u</div>
          <div class="li-total">${APP.money(l.PRECIO * l.CANTIDAD)}</div>
        </div>
      </div>
    `).join('');

    cont.querySelectorAll('.linea-ticket').forEach(fila => {
      const i = Number(fila.dataset.i);
      fila.querySelector('.li-cant').addEventListener('change', (e) => {
        const v = Math.max(1, parseInt(e.target.value, 10) || 1);
        ticket[i].CANTIDAD = v;
        pintarTicket();
      });
      fila.querySelector('.li-quitar').addEventListener('click', () => {
        ticket.splice(i, 1);
        pintarTicket();
      });
    });
  }

  calcularTotales();
}

function calcularTotales() {
  const subtotal = ticket.reduce((s, l) => s + l.PRECIO * l.CANTIDAD, 0);
  const descuento = Number(document.getElementById('descuento').value) || 0;
  const total = Math.max(0, subtotal - descuento);
  document.getElementById('tot-subtotal').textContent = APP.money(subtotal);
  document.getElementById('tot-total').textContent = APP.money(total);
}

document.getElementById('descuento').addEventListener('input', calcularTotales);

/* ---------------- Cobrar ---------------- */

document.getElementById('btn-cobrar').addEventListener('click', async () => {
  if (!ticket.length) { APP.toast('Agrega al menos un producto.', 'error'); return; }

  const btn = document.getElementById('btn-cobrar');
  const descuentoTotal = Number(document.getElementById('descuento').value) || 0;

  const payload = {
    lineas: ticket.map(l => ({ CODIGO: l.CODIGO, CANTIDAD: l.CANTIDAD, PRECIO: l.PRECIO })),
    CLIENTE: document.getElementById('cliente').value.trim(),
    TIPO_COBRO: document.getElementById('tipo_cobro').value,
    NUM_FACTURA: document.getElementById('num_factura').value.trim(),
    ENTREGA: document.getElementById('entrega').value,
    CONSIGNA: document.getElementById('consigna').checked,
    OBSERVACION: document.getElementById('observacion').value.trim()
  };

  // El descuento del ticket se reparte en la primera línea; el backend lo aplica al total de esa partida.
  if (descuentoTotal > 0 && payload.lineas.length) {
    payload.lineas[0].DESCUENTO = descuentoTotal;
  }

  btn.disabled = true;
  btn.textContent = 'Cobrando...';
  try {
    const r = await API.guardarVenta(payload);
    APP.toast(`Venta registrada · nota ${r.NOTA} · ${APP.money(r.TOTAL)}`, 'exito');
    limpiarTicket();
  } catch (e) {
    APP.errorApi(e, 'cobrar venta');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Cobrar venta';
  }
});

function limpiarTicket() {
  ticket = [];
  document.getElementById('cliente').value = '';
  document.getElementById('num_factura').value = '';
  document.getElementById('observacion').value = '';
  document.getElementById('descuento').value = 0;
  document.getElementById('consigna').checked = false;
  document.getElementById('tipo_cobro').disabled = false;
  document.getElementById('tipo_cobro').value = 'EFECTIVO';
  document.getElementById('entrega').value = 'TIENDA';
  document.getElementById('bloque-especial').classList.add('oculto');
  pintarTicket();
  buscarProductos(document.getElementById('buscar').value.trim());
}
</script>
</body>
</html>
