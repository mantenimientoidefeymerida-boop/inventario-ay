<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizaciones — Acabados Yucatán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<style>
  .main { padding: 0; }
  .tabs-cot { padding: 18px 28px 0; background: var(--cal); border-bottom: 1px solid var(--linea); }

  .cot-grid { display: flex; height: calc(100vh - 65px - 49px); overflow: hidden; }
  .col-buscar { flex: 1.4; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--linea); }
  .buscar-caja { padding: 18px 22px 14px; border-bottom: 1px solid var(--linea); background: var(--cal); }
  .buscar-caja input { width: 100%; font-size: 16px; padding: 13px 14px; border: 1px solid var(--linea); border-radius: var(--radio); font-family: inherit; }
  .buscar-caja input:focus { border-color: var(--acero); }
  .lista-resultados { flex: 1; overflow-y: auto; }
  .fila-producto { display: grid; grid-template-columns: 90px 1fr 90px 90px 40px; gap: 12px; align-items: center; padding: 12px 22px; border-bottom: 1px solid var(--linea); }
  .fila-producto:hover { background: rgba(43,110,119,0.06); cursor: pointer; }
  .fila-producto .prod-nombre { font-size: 14px; }
  .fila-producto .prod-cat { font-size: 11px; color: var(--texto-suave); margin-top: 2px; }
  .fila-producto .prod-existencia { font-size: 12px; text-align: right; font-family: var(--fuente-mono); }
  .fila-producto .prod-precio { text-align: right; font-family: var(--fuente-mono); font-weight: 600; }
  .fila-producto .prod-agregar { width: 30px; height: 30px; border-radius: 50%; background: var(--acero); color: #fff; border: none; font-size: 18px; }

  .col-panel { flex: 1; max-width: 480px; display: flex; flex-direction: column; background: var(--cal); overflow-y: auto; }
  .panel-cabecera { padding: 16px 20px; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; align-items: center; }
  .panel-cabecera .folio { font-family: var(--fuente-mono); font-size: 20px; font-weight: 700; color: var(--acero-osc); }
  .panel-cabecera .folio-etq { font-size: 11px; color: var(--texto-suave); }

  .cliente-compacta { padding: 12px 20px; border-bottom: 1px solid var(--linea); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cliente-compacta .campo label { font-size: 10.5px; }
  .cliente-compacta .campo input { padding: 8px 10px; font-size: 13.5px; }

  .lineas-cabecera { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 4px; }
  .lineas-cabecera .titulo { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--texto-suave); font-weight: 600; }
  .lineas-cabecera button { background: none; border: none; color: var(--acero-osc); font-size: 12.5px; font-weight: 600; }
  .lineas-cabecera button:hover { text-decoration: underline; }

  .panel-lineas { flex: 1 1 auto; min-height: 160px; overflow-y: auto; border-bottom: 1px solid var(--linea); }
  .linea-cot { padding: 13px 20px; border-bottom: 1px solid var(--linea); }
  .linea-cot:nth-child(odd) { background: rgba(43,110,119,0.025); }
  .linea-cot .lc-nombre { font-size: 14.5px; font-weight: 500; margin-bottom: 9px; line-height: 1.3; }
  input.lc-nombre-editable { width: 100%; font-size: 14px; border: 1px solid var(--linea); border-radius: var(--radio); padding: 7px 9px; margin-bottom: 9px; }
  .lc-fila { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .lc-campo { display: flex; flex-direction: column; gap: 3px; }
  .lc-campo label { font-size: 10px; color: var(--texto-suave); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .lc-num { width: 68px; text-align: center; padding: 6px 5px; border: 1px solid var(--linea); border-radius: var(--radio); font-family: var(--fuente-mono); font-size: 13px; }
  .lc-total { margin-left: auto; text-align: right; }
  .lc-total .lc-total-valor { font-family: var(--fuente-mono); font-weight: 700; font-size: 16px; }
  .lc-total .lc-quitar { display: block; background: none; border: none; color: var(--texto-suave); font-size: 11px; margin-top: 3px; }
  .lc-total .lc-quitar:hover { color: var(--rojo-ladrillo); }

  .panel-form { padding: 12px 20px; display: flex; flex-direction: column; gap: 10px; }
  .panel-totales { padding: 14px 20px; border-top: 1px solid var(--linea); }
  .fila-total { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; color: var(--texto-suave); }
  .fila-total.grande { font-size: 19px; font-weight: 700; color: var(--concreto-osc); margin-top: 8px; }
  .input-chico { width: 90px; text-align: right; padding: 4px 8px; border: 1px solid var(--linea); border-radius: var(--radio); font-family: var(--fuente-mono); font-size: 13px; }
  .panel-botones { display: flex; gap: 8px; }
  .panel-botones .btn { flex: 1; }

  /* Historial */
  .hist { padding: 22px 28px; }

  @media (max-width: 860px) {
    .cot-grid { flex-direction: column; height: auto; overflow: visible; }
    .col-buscar { border-right: none; border-bottom: 1px solid var(--linea); }
    .col-panel { max-width: none; }
    .lista-resultados { max-height: 40vh; }
  }
</style>
</head>
<body>

<div id="app-shell"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const u = APP.montarLayout('cotizaciones.html', 'Cotizaciones');
const main = document.getElementById('main');

main.innerHTML = `
  <div class="tabs-cot">
    <div class="tabs" style="margin-bottom:0;border-bottom:none">
      <button class="tab" data-tab="nueva">Nueva cotización</button>
      <button class="tab" data-tab="historial">Historial</button>
    </div>
  </div>
  <div id="vista"></div>
`;

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => cambiarTab(t.dataset.tab)));

let numActual = null;   // NUM asignado tras el primer guardado
let lineas = [];        // {CODIGO, PRODUCTO, CANTIDAD, PRECIO, libre}
let categoriaActiva = '';

function cambiarTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('activo', t.dataset.tab === tab));
  if (tab === 'nueva') pintarNueva();
  else pintarHistorial();
}
cambiarTab('nueva');

/* ============================================================
   NUEVA COTIZACIÓN
   ============================================================ */

async function pintarNueva() {
  const vista = document.getElementById('vista');
  vista.innerHTML = `
    <div class="cot-grid">
      <div class="col-buscar">
        <div class="buscar-caja">
          <input type="text" id="buscar" placeholder="Buscar producto por código o nombre..." autocomplete="off">
        </div>
        <div class="lista-resultados" id="lista-resultados"><div class="cargando">Escribe para buscar...</div></div>
      </div>

      <div class="col-panel">
        <div class="panel-cabecera">
          <div>
            <div class="folio-etq">Cotización</div>
            <div class="folio" id="folio-num">...</div>
          </div>
          <button class="btn btn-secundario" id="btn-limpiar">Nueva</button>
        </div>

        <div class="cliente-compacta">
          <div class="campo">
            <label for="pf-cliente">Cliente</label>
            <input type="text" id="pf-cliente" list="pf-lista-clientes" placeholder="Nombre del cliente">
            <datalist id="pf-lista-clientes"></datalist>
          </div>
          <div class="campo">
            <label for="pf-domicilio">Domicilio</label>
            <input type="text" id="pf-domicilio" placeholder="Opcional">
          </div>
        </div>

        <div class="lineas-cabecera">
          <span class="titulo">Productos agregados</span>
          <button type="button" id="btn-linea-libre">+ Concepto libre</button>
        </div>
        <div class="panel-lineas" id="panel-lineas"></div>

        <div class="panel-totales">
          <div class="fila-total"><span>Subtotal</span><span class="num" id="ct-subtotal">$0.00</span></div>
          <div class="fila-total"><span>Descuento general</span><input type="number" id="ct-descuento" class="input-chico" value="0" min="0" step="1"></div>
          <div class="fila-total grande"><span>Total</span><span class="num" id="ct-total">$0.00</span></div>

          <div class="campo mt-16">
            <label for="pf-obs">Observaciones</label>
            <input type="text" id="pf-obs" placeholder="Opcional">
          </div>

          <div class="panel-botones mt-16">
            <button class="btn btn-secundario" id="btn-guardar">Guardar</button>
            <button class="btn btn-primario" id="btn-pdf" disabled>Generar PDF</button>
          </div>
        </div>
      </div>
    </div>
  `;

  limpiarFormulario();
  cargarFolioPreview();
  cargarClientes();
  buscarProductos('');

  document.getElementById('buscar').addEventListener('input', debounce((e) => buscarProductos(e.target.value.trim()), 220));
  document.getElementById('btn-limpiar').addEventListener('click', () => { limpiarFormulario(); cargarFolioPreview(); });
  document.getElementById('btn-linea-libre').addEventListener('click', agregarLineaLibre);
  document.getElementById('ct-descuento').addEventListener('input', calcularTotales);
  document.getElementById('btn-guardar').addEventListener('click', guardarCotizacion);
  document.getElementById('btn-pdf').addEventListener('click', descargarPdf);
}

async function cargarFolioPreview() {
  if (numActual) return; // ya es una cotización real, no mostrar preview
  try {
    const r = await API.folioCotizacion();
    document.getElementById('folio-num').textContent = 'N° ' + r.NUM;
  } catch (e) { /* silencioso: es solo una vista previa */ }
}

async function cargarClientes() {
  try {
    const clientes = await API.listarClientes();
    document.getElementById('pf-lista-clientes').innerHTML =
      clientes.map(c => `<option value="${APP.escapar(c.NOMBRE)}">`).join('');
  } catch (e) { /* silencioso */ }
}

async function buscarProductos(texto) {
  const cont = document.getElementById('lista-resultados');
  if (!cont) return;
  cont.innerHTML = '<div class="cargando">Buscando...</div>';
  try {
    const productos = await API.listarProductos({ buscar: texto, categoria: categoriaActiva });
    if (!productos.length) { cont.innerHTML = '<div class="vacio">Sin resultados.</div>'; return; }
    cont.innerHTML = productos.map(p => `
      <div class="fila-producto" data-codigo="${APP.escapar(p.CODIGO)}">
        <div class="codigo texto-chico">${APP.escapar(p.CODIGO)}</div>
        <div><div class="prod-nombre">${APP.escapar(p.PRODUCTO)}</div><div class="prod-cat">${APP.escapar(p.CATEGORIA)}</div></div>
        <div class="prod-existencia">${p.EXISTENCIA} ${p.UNIDAD || ''}</div>
        <div class="prod-precio">${APP.money(p.VENTA)}</div>
        <button class="prod-agregar" type="button">+</button>
      </div>
    `).join('');
    cont.querySelectorAll('.fila-producto').forEach(fila => {
      const prod = productos.find(p => p.CODIGO === fila.dataset.codigo);
      fila.addEventListener('click', () => agregarLinea(prod));
    });
  } catch (e) {
    APP.errorApi(e, 'buscar productos');
    cont.innerHTML = '<div class="vacio">No se pudo buscar.</div>';
  }
}

function agregarLinea(prod) {
  const existente = lineas.find(l => l.CODIGO === prod.CODIGO);
  if (existente) existente.CANTIDAD += 1;
  else lineas.push({ CODIGO: prod.CODIGO, PRODUCTO: prod.PRODUCTO, CANTIDAD: 1, PRECIO: prod.VENTA, DESCUENTO_PCT: 0, libre: false });
  pintarLineas();
}

function agregarLineaLibre() {
  lineas.push({ CODIGO: '', PRODUCTO: '', CANTIDAD: 1, PRECIO: 0, DESCUENTO_PCT: 0, libre: true });
  pintarLineas();
}

/** Total de una línea aplicando su % de descuento individual (nunca negativo). */
function totalLinea(l) {
  const bruto = (Number(l.CANTIDAD) || 0) * (Number(l.PRECIO) || 0);
  const pct = Math.min(100, Math.max(0, Number(l.DESCUENTO_PCT) || 0));
  return Math.max(0, bruto - (bruto * pct / 100));
}

/** El backend guarda el descuento en pesos, así que el % se convierte solo al guardar. */
function montoDescuentoLinea(l) {
  const bruto = (Number(l.CANTIDAD) || 0) * (Number(l.PRECIO) || 0);
  const pct = Math.min(100, Math.max(0, Number(l.DESCUENTO_PCT) || 0));
  return Math.round(bruto * pct) / 100;
}

function pintarLineas() {
  const cont = document.getElementById('panel-lineas');
  if (!lineas.length) {
    cont.innerHTML = '<div class="vacio">Agrega productos o un concepto libre.</div>';
    calcularTotales();
    return;
  }

  cont.innerHTML = lineas.map((l, i) => `
    <div class="linea-cot" data-i="${i}">
      ${l.libre
        ? `<input type="text" class="lc-nombre-editable" data-campo="nombre" placeholder="Describe el concepto" value="${APP.escapar(l.PRODUCTO)}">`
        : `<div class="lc-nombre">${APP.escapar(l.PRODUCTO)}</div>`}
      <div class="lc-fila">
        <div class="lc-campo"><label>Cant.</label><input type="number" class="lc-num" data-campo="cantidad" value="${l.CANTIDAD}" min="0.01" step="0.01"></div>
        <div class="lc-campo"><label>Precio</label><input type="number" class="lc-num" data-campo="precio" value="${l.PRECIO}" min="0" step="0.01"></div>
        <div class="lc-campo"><label>Desc. %</label><input type="number" class="lc-num" data-campo="descuento" value="${l.DESCUENTO_PCT || 0}" min="0" max="100" step="1"></div>
        <div class="lc-total">
          <div class="lc-total-valor" id="lc-total-${i}">${APP.money(totalLinea(l))}</div>
          <button type="button" class="lc-quitar">Quitar</button>
        </div>
      </div>
    </div>
  `).join('');

  cont.querySelectorAll('.linea-cot').forEach(fila => {
    const i = Number(fila.dataset.i);

    // Al escribir, solo se actualiza el dato y el total de ESA línea (sin
    // reconstruir el HTML), para que el campo no pierda el foco a media palabra.
    fila.querySelectorAll('[data-campo]').forEach(input => {
      input.addEventListener('input', () => {
        const campo = input.dataset.campo;
        if (campo === 'nombre') lineas[i].PRODUCTO = input.value;
        else if (campo === 'cantidad') lineas[i].CANTIDAD = Number(input.value) || 0;
        else if (campo === 'precio') lineas[i].PRECIO = Number(input.value) || 0;
        else if (campo === 'descuento') lineas[i].DESCUENTO_PCT = Math.min(100, Math.max(0, Number(input.value) || 0));

        const totalEl = document.getElementById('lc-total-' + i);
        if (totalEl) totalEl.textContent = APP.money(totalLinea(lineas[i]));
        calcularTotales();
      });
    });

    // Quitar sí necesita reconstruir la lista completa (cambia el número de líneas).
    fila.querySelector('.lc-quitar').addEventListener('click', () => { lineas.splice(i, 1); pintarLineas(); });
  });

  calcularTotales();
}

function calcularTotales() {
  const subtotal = lineas.reduce((s, l) => s + totalLinea(l), 0);
  const descuento = Number(document.getElementById('ct-descuento')?.value) || 0;
  const total = Math.max(0, subtotal - descuento);
  const sub = document.getElementById('ct-subtotal'); if (sub) sub.textContent = APP.money(subtotal);
  const tot = document.getElementById('ct-total'); if (tot) tot.textContent = APP.money(total);
}

async function guardarCotizacion() {
  if (!lineas.length) { APP.toast('Agrega al menos un producto o concepto.', 'error'); return; }
  const cliente = document.getElementById('pf-cliente').value.trim();
  if (!cliente) { APP.toast('Escribe el nombre del cliente.', 'error'); return; }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const r = await API.guardarCotizacion({
      NUM: numActual || undefined,
      CLIENTE: cliente,
      DOMICILIO: document.getElementById('pf-domicilio').value.trim(),
      DESCUENTO: document.getElementById('ct-descuento').value,
      OBSERVACIONES: document.getElementById('pf-obs').value.trim(),
      lineas: lineas.map(l => ({ CODIGO: l.CODIGO, PRODUCTO: l.PRODUCTO, CANTIDAD: l.CANTIDAD, PRECIO: l.PRECIO, DESCUENTO: montoDescuentoLinea(l) }))
    });
    numActual = r.NUM;
    document.getElementById('folio-num').textContent = 'N° ' + r.NUM;
    document.getElementById('btn-pdf').disabled = false;
    APP.toast(`Cotización ${r.NUM} guardada · ${APP.money(r.TOTAL)}`, 'exito');
  } catch (e) {
    APP.errorApi(e, 'guardar cotización');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

async function descargarPdf() {
  if (!numActual) return;
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true; btn.textContent = 'Generando...';
  try {
    await API.descargarPdfCotizacion(numActual);
  } catch (e) {
    APP.errorApi(e, 'generar PDF');
  } finally {
    btn.disabled = false; btn.textContent = 'Generar PDF';
  }
}

function limpiarFormulario() {
  numActual = null;
  lineas = [];
  pintarLineas();
  const f = ['pf-cliente','pf-domicilio','pf-obs'];
  f.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const desc = document.getElementById('ct-descuento'); if (desc) desc.value = 0;
  const btnPdf = document.getElementById('btn-pdf'); if (btnPdf) btnPdf.disabled = true;
  calcularTotales();
}

/* ============================================================
   HISTORIAL
   ============================================================ */

async function pintarHistorial(filtro = {}) {
  const vista = document.getElementById('vista');
  vista.innerHTML = `<div class="hist"><div class="cargando">Cargando historial...</div></div>`;
  try {
    const cats = await API.catalogos();
    const cotizaciones = await API.listarCotizaciones(filtro);

    vista.innerHTML = `
      <div class="hist">
        <div class="filtros">
          <div class="campo"><label for="h-cliente">Cliente</label><input type="text" id="h-cliente" value="${APP.escapar(filtro.cliente || '')}"></div>
          <div class="campo">
            <label for="h-estatus">Estatus</label>
            <select id="h-estatus">
              <option value="">Todos</option>
              ${cats.ESTATUS_COT.map(s => `<option value="${s}" ${filtro.estatus===s?'selected':''}>${etiquetaEstatus(s)}</option>`).join('')}
            </select>
          </div>
        </div>
        <table>
          <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th class="alinear-derecha">Total</th><th>Estatus</th><th></th></tr></thead>
          <tbody id="tbody-cot"></tbody>
        </table>
      </div>
    `;

    document.getElementById('h-cliente').addEventListener('input', debounce(() => filtrarHistorial(), 250));
    document.getElementById('h-estatus').addEventListener('change', () => filtrarHistorial());

    const tbody = document.getElementById('tbody-cot');
    if (!cotizaciones.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="vacio">No hay cotizaciones con ese filtro.</div></td></tr>`;
    } else {
      tbody.innerHTML = cotizaciones.map(c => `
        <tr>
          <td class="folio">${APP.escapar(c.NUM)}</td>
          <td>${APP.escapar(c.FECHA)}</td>
          <td>${APP.escapar(c.CLIENTE)}</td>
          <td class="num alinear-derecha">${APP.money(c.TOTAL)}</td>
          <td><span class="estado ${claseEstatus(c.ESTATUS)}">${etiquetaEstatus(c.ESTATUS)}</span></td>
          <td class="flex gap-8">
            <button class="btn-mini" data-pdf="${c.NUM}">PDF</button>
            ${c.ESTATUS !== 'FACTURADA' ? `<button class="btn-mini" data-venta="${c.NUM}">Convertir a venta</button>` : ''}
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => API.descargarPdfCotizacion(b.dataset.pdf).catch(e => APP.errorApi(e))));
      tbody.querySelectorAll('[data-venta]').forEach(b => b.addEventListener('click', () => abrirModalConvertir(b.dataset.venta)));
    }
  } catch (e) {
    APP.errorApi(e, 'listar cotizaciones');
    vista.innerHTML = '<div class="hist"><div class="vacio">No se pudo cargar el historial.</div></div>';
  }
}

function filtrarHistorial() {
  pintarHistorial({
    cliente: document.getElementById('h-cliente').value.trim(),
    estatus: document.getElementById('h-estatus').value
  });
}

function etiquetaEstatus(s) {
  const mapa = { ABIERTA: 'Abierta', ENVIADA: 'Enviada', ACEPTADA: 'Aceptada', RECHAZADA: 'Rechazada', FACTURADA: 'Facturada' };
  return mapa[s] || s;
}
function claseEstatus(s) {
  if (s === 'FACTURADA' || s === 'ACEPTADA') return 'estado-pagado';
  if (s === 'RECHAZADA') return 'estado-cancelado';
  return 'estado-pendiente';
}

async function abrirModalConvertir(num) {
  const cats = await API.catalogos().catch(() => null);
  if (!cats) return;

  const fondo = APP.abrirModal(`
    <div class="modal-caja">
      <div class="modal-cabecera"><h3>Convertir cotización ${num} en venta</h3><button class="modal-cerrar" id="m-cerrar">&times;</button></div>
      <div class="modal-cuerpo">
        <div class="aviso">Esto descuenta del inventario las partidas de la cotización y registra la venta.</div>
        <div class="campo">
          <label for="cv-cobro">Forma de cobro</label>
          <select id="cv-cobro">${cats.TIPO_COBRO.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
        </div>
        <div class="campo">
          <label for="cv-factura">Factura (opcional)</label>
          <input type="text" id="cv-factura">
        </div>
        <div class="campo-check">
          <input type="checkbox" id="cv-consigna">
          <label for="cv-consigna">Venta en consigna (se maneja como crédito)</label>
        </div>
      </div>
      <div class="modal-pie">
        <button class="btn btn-secundario" id="m-cancelar">Cancelar</button>
        <button class="btn btn-primario" id="m-confirmar">Confirmar venta</button>
      </div>
    </div>
  `);
  fondo.querySelector('#m-cerrar').addEventListener('click', APP.cerrarModal);
  fondo.querySelector('#m-cancelar').addEventListener('click', APP.cerrarModal);
  fondo.querySelector('#m-confirmar').addEventListener('click', async () => {
    const btn = fondo.querySelector('#m-confirmar');
    btn.disabled = true; btn.textContent = 'Registrando...';
    try {
      const r = await API.cotizacionAVenta({
        NUM: num,
        TIPO_COBRO: fondo.querySelector('#cv-cobro').value,
        NUM_FACTURA: fondo.querySelector('#cv-factura').value.trim(),
        CONSIGNA: fondo.querySelector('#cv-consigna').checked
      });
      APP.toast(`Venta registrada · nota ${r.NOTA} · ${APP.money(r.TOTAL)}`, 'exito');
      APP.cerrarModal();
      filtrarHistorial();
    } catch (e) {
      APP.errorApi(e, 'convertir a venta');
      btn.disabled = false; btn.textContent = 'Confirmar venta';
    }
  });
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
</script>
